<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing: border-box;
        background-color: black;
    }
    .parent{
        display: flex;
        align-items: center;
        justify-content: center;
        height:100vh;
    }

    .box{
        position: relative;
        width: 300px;
        height: 200px;
        border: 1px solid white;
       
    }
    .circle{
        height: 80px;
        width: 80px;
        position :absolute;
        right:-20px;
        top:-20px;
        background: yellow;
        border-radius: 50%;
        display: flex;
    align-items: center;
    justify-content: center;
    }
</style>
<body>
    
    <div class="parent">
        <div class="box">
            <div class="circle">
                20% off
            </div>
        </div>
    </div>
</body>
</html>
