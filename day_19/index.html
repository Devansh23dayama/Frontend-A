<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div
      style="
        height: 100vh;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <div style="height: 200px; width: 200px">
        <div
          style="
            background-color: rgb(221, 27, 27);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: relative;
            left: 40px;
          "
        ></div>
        <div
          style="
            background-color: rgb(221, 27, 27);
            width: 47px;
            height: 50px;
            border-radius: 50%;
            position: relative;
            left: 80px;
            top: -50px;
          "
        ></div>
        <div
          style="
            background-color: rgb(221, 27, 27);
            width: 52px;
            height: 50px;
            position: relative;
            left: 57px;
            top: -82px;
            transform: rotate(45deg);
          "
        ></div>
        <div
          style="
            background-color: blue;
            height: 215px;
            position: absolute;
            top: 200px;
            right: 400px;
            transform: rotate(55deg);
            width: 2px;
          "
        ></div>
        <div style="background-color: black">
          <div
            style="
              background-color: blue;
              width: 30px;
              height: 25px;
              position: relative;
              top:-55px;
              left: -40px;
              transform: rotate(145deg);
            "
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
