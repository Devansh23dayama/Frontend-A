<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin:0;
    }
    .parent{
        background-color: rgb(22, 21, 21);
        height:110vh;
        margin:20px;
        border:5px solid aqua;
    }
    .voicediv {
      background-color: grey;
      border:2px solid white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content:center;
      align-items: center;
      position:relative;
      
    }
    .voicedivtext {
        position: relative;
        top:-3.5px;
      color: white;
    }
    .v1{
        display: flex;
        justify-content: end;
        padding:10px;
    }
    .circleparent{
     
        display: flex;
        justify-content: center;
        align-items: center;
        height:90vh;
        border-radius: 10px;
    }
    .circle{
        width:200px;
        height:200px;
        background-color: green;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;

    }
    .circletext{
        font-size: 40px;
        color: antiquewhite;
    }
    .divtext{
       
        height:5vh;
        padding:20px;
    }
    .divtext h2{
        color:white;
    }
   
</style>
<body>
    <div class="parent">
       <div class="v1">
        <div class="voicediv">
            <div class="voicedivtext">
              <p>...</p>
            </div>
          </div>
       </div>
        <div class="circleparent">
            <div class="circle">
                <div class="circletext">
                    <h1>R</h1>
                </div>
            </div>
        </div>
        <div class="divtext"><h2>Regex software</h2></div>
    </div>
</body>
</html>
