<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="https://storage.googleapis.com/pr-newsroom-wp/1/2023/05/Spotify_Primary_Logo_RGB_Green.png"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Spotify</title>
    <style>
      /* *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        } */
    </style>
  </head>
  <body class="bg-black h-screen flex flex-col">
    <!-- navbar -->
    <div class="h-14 flex gap-2">
      <div class="w-84">
        <img
          class="h-15 w-15"
          src="https://i.pinimg.com/736x/45/cc/6c/45cc6c91692a3665d97b570a3272132a.jpg"
          alt=""
        />
      </div>
      <div class="flex flex-1 justify-center items-center gap-7">
        <!-- home -->
        <span
          class="bg-[#121212] w-10 h-10 flex justify-center items-center rounded-full"
        >
          <i class="fas fa-home text-xl text-white"></i
        ></span>
        <!-- search -->

        <span
          class="bg-[#121212] rounded-2xl hover:scale-105 w-80 h-11 mt-1 rounded-3xl text-white flex justify-center items-center gap-5"
        >
          <i class="fas fa-search ml-3"></i
          ><input
            class="w-80 border-none focus:outline-none focus:ring-0"
            type="text"
            placeholder="What do you want to play?"
          /><i class="far fa-folder-open mr-3"></i>
        </span>
      </div>
      <div class="w-110 flex justify-center items-center gap-10">
        <div class="flex gap-3 w-full">
          <!-- explore -->
          <span
            ><button
              class="bg-white text-black px-2 py-2 rounded active:bg-white rounded-2xl text-sm hover:scale-105"
            >
              <b>Explore Premium</b>
            </button></span
          >
          <!-- install -->
          <span
            class="bg-[#121212] text-white px-2 py-2 rounded active:bg-white rounded-2xl text-sm"
            ><i
              class="fas fa-arrow-alt-circle-down text-white w-5 hover:scale-105"
            ></i
            ><button>Install App</button></span
          >
        </div>
        <span><i class="far fa-bell text-white hover:scale-105"></i></span>
        <span><i class="fas fa-users text-white hover:scale-105"></i></span>
        <span
          ><button
            class="h-10 w-10 rounded-full bg-green-500 flex justify-center items-center shadow-lg shadow-[#121212] border-5 border-slate-500 hover:scale-105"
          >
            <b>D</b>
          </button></span
        >
      </div>
    </div>
    <!-- mainbody -->
    <div class="flex flex-1 gap-2 mt-2 mb-2">
      <!-- leftsidebar -->
      <div class="bg-[#121212] w-82 rounded-2xl ml-2">
        <!-- create -->
        <div class="h-14 text-white flex justify-evenly items-center">
          <b>Your Library</b>
          <div
            class="bg-[#1e1e1e] text-white px-3 py-2 rounded-full ml-15 hover:scale-105"
          >
            <i class="fa-solid fa-plus text-white"></i>
            <button class="">Create</button>
          </div>
          <button class="bg-[#1e1e1e] rounded-full p-2 hover:scale-105"><i
            class="fa-solid fa-up-right-and-down-left-from-center ml-1 hover:scale-105"
          ></i></button>
        </div>
        <!-- playlist & artist -->
        <div class="flex gap-3 p-1">
          <div
            class="bg-[#1e1e1e] text-white w-23 h-7 rounded-full hover:scale-105 hover:cursor-pointer flex justify-center items-center"
          >
            <button class="hover:cursor-pointer">playlists</button>
          </div>
          <div
            class="bg-[#1e1e1e] text-white w-23 h-7 rounded-full hover:scale-105 hover:cursor-pointer flex justify-center items-center"
          >
            <button class="hover:scale-105">Artist</button>
          </div>
        </div>
        <!-- search button -->
        <div class="flex justify-between p-2">
          <div><i class="fa-solid fa-magnifying-glass text-white"></i></div>

          <div class="text-white">
            Recent<i class="fa-solid fa-list text-white ml-2"></i>
          </div>
        </div>
      </div>
      <!-- main -->
      <div class="bg-[#121212] flex flex-1 rounded-2xl"></div>
      <!-- rightsidebar -->
      <div class="bg-[#121212] w-64 rounded-2xl mr-2"></div>
    </div>
    <!-- playbar -->
    <div class="h-15 bg-blue-400"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </body>
</html>
