<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let percentage = prompt("enter the percentage ")

switch(true) {
case percentage>=80 && percentage<=100 : 
    alert(`A`);
    break;

    case percentage>=70 && percentage<=79 : 
    alert(`B`);
    break;

    case percentage>=60 && percentage<=69 : 
    alert(`C`);
    break;

    case percentage>=50 && percentage<=59 : 
    alert(`D`);
    break;

    case percentage>=33 && percentage<=49 : 
    alert(`E`);
    break;

    default:
    alert(`fail`);
    break;

}
    </script>
</head>

</body>
</html>
